version: 2

models:
  - name: mart_daily_earthquake_summary
    description: One row per day with earthquake counts and magnitudes.
    columns:
      - name: quake_date
        data_tests:
          - unique
          - not_null

  - name: mart_city_quake_exposure
    description: Daily weather per city plus earthquakes within 1,000 km.
    columns:
      - name: city
        data_tests:
          - not_null
      - name: weather_date
        data_tests:
          - not_null
